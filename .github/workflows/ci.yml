name: CertChain CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-contract/package-lock.json

      - name: Install dependencies
        working-directory: smart-contract
        run: npm ci

      - name: Run Hardhat tests
        working-directory: smart-contract
        run: npx hardhat test

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and type-check frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run type-check

  deploy:
    runs-on: ubuntu-latest
    needs:
      - test-contract
      - test-backend
      - lint-frontend
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ github.ref_name }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/certchain-backend:${{ github.ref_name }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/certchain-frontend:${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t "${BACKEND_IMAGE}" ./backend
          docker push "${BACKEND_IMAGE}"

      - name: Build and push frontend image
        run: |
          docker build -t "${FRONTEND_IMAGE}" ./frontend
          docker push "${FRONTEND_IMAGE}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_REF,DEPLOY_PATH,BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -e
            cd "$DEPLOY_PATH"

            git fetch --all --tags
            git checkout "$DEPLOY_REF"
            git pull origin "$DEPLOY_REF" || true

            docker pull "$BACKEND_IMAGE" || true
            docker pull "$FRONTEND_IMAGE" || true

            docker compose down
            docker compose up -d --build --remove-orphans
