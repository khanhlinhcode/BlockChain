<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CertChain Offline</title>
    <style>
      body {
        margin: 0;
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0f1e;
        color: #f9fafb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      h1 {
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: -0.03em;
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 24px;
        max-width: 420px;
        background: rgba(17, 24, 39, 0.85);
      }
      a {
        color: #00d4ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline Mode</h1>
      <p>Network connection is unavailable. If previously verified, reopen CertChain and use the last cached verification result.</p>
      <p><a href="/">Back to CertChain</a></p>
    </div>
  </body>
</html>
